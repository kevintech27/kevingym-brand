<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="96" ry="96"/></clipPath>
    <!-- Rim light on the top edge, the same hairline the glass cards catch in
         the page. Invisible at 16px, and that is the point: its only job is to
         stop the 180px tile from reading as a flat black square. White at 10%,
         not cyan, because the accent belongs to the builder section and
         nowhere else. -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10" />
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#000000"/>

    <!-- K for Kevin. The personal site gets its own mark: the V emblem stays
         the KEVINGYM product logo on kevingymworkout.com, so the two domains
         stop serving the same icon in the same search result.

         Not a font K. The two arms are one 58px bar each, pivoted 38 degrees
         around a single vertex on the stem, so their ends are cut square to
         their own axis. That is the cut language of the V mark, and it is what
         keeps the two marks in the same family. The stem loses its top left
         corner to a 45 degree chamfer, the same bevel again.

         Arm length is capped at 215: past that the tips fall outside the
         circle Google masks favicons with, and the K comes back clipped.

         The mark stays white. A black on black K is invisible on the surfaces
         where a favicon is actually seen: Google in dark mode, a browser tab,
         an iOS home screen. -->
    <g fill="#FFFFFF">
      <path d="M164,116 H194 V396 H136 V144 Z"/>
      <g transform="rotate(-38 194 256)"><rect x="164" y="227" width="245" height="58"/></g>
      <g transform="rotate(38 194 256)"><rect x="164" y="227" width="245" height="58"/></g>
    </g>

    <rect x="1.5" y="1.5" width="509" height="509" rx="94.5" ry="94.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  </g>
</svg>
